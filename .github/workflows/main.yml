name: Vacancy check

on:
  schedule:
    - cron: "7 * * * *"      # каждый час в :07 (время UTC)
  workflow_dispatch:
    inputs:
      query:
        description: "Разовый поиск (пусто — обычная проверка новых). Флаги: --any --raw --days 7"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: vacancies
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install httpx

      - name: Run
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SUPERJOB_KEY: ${{ secrets.SUPERJOB_KEY }}
          APP_UA: ${{ secrets.APP_UA }}
          QUERY: ${{ github.event.inputs.query }}
        run: |
          if [ -n "$QUERY" ]; then
            python run_once.py search "$QUERY"
          else
            python run_once.py check
          fi

      - name: Save state
        run: |
          git config user.name "vacancy-bot"
          git config user.email "vacancy-bot@users.noreply.github.com"
          mkdir -p state
          git add state
          git diff --cached --quiet || (git commit -m "update state [skip ci]" && git push)
